    <script type="module">
        // 1. ALL IMPORTS GO HERE AT THE TOP
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, updateDoc, increment, onSnapshot, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { converter, differenceCiede2000, parse } from 'https://esm.sh/culori@3';
        import { ALL_COLORS, setupDictionarySelector } from './dictionary.js';
        
        // 2. INITIALIZE FIREBASE HERE
        const firebaseConfig = {
            apiKey: "AIzaSyB_349ubNBxT7hkEPeny6T10Ary9wRtUCw",
            authDomain: "colordle-10261.firebaseapp.com",
            projectId: "colordle-10261",
            storageBucket: "colordle-10261.firebasestorage.app",
            messagingSenderId: "763118809880",
            appId: "1:763118809880:web:fa6003f660c495eb55a46d",
            measurementId: "G-50GQQV2KZN"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 3. REST OF GAME LOGIC
        const CSV_URL = 'colornames.csv';
        const toLab = converter('lab');
        const calcDeltaE = differenceCiede2000();

        
        let guessCount = 0;
        let targetColor = null;
        let targetLab = null;
        let currentSeed = null;
        let unsubscribeStats = null;

        // Preferences
        let maxSuggestions = 1;
        const maxInput = document.getElementById('maxSuggestionsInput');
        const maxDisplay = document.getElementById('maxCountDisplay');

        maxInput.value = maxSuggestions;
        maxDisplay.innerText = maxSuggestions;

        let sortOrder = 'best'; 

        let gameState = { seed: null, won: false, guesses: [], submitted: false, rank: null };


        function initGame(customSeed = null) {
            document.getElementById('historyList').innerHTML = '';
            document.getElementById('targetDisplay').style.display = 'none';
            document.getElementById('guessInput').value = '';
            document.getElementById('inputPreview').style.backgroundColor = 'transparent';

            currentSeed = customSeed !== null ? customSeed : Math.floor(Date.now() / 86400000);
            document.getElementById('seedInput').value = currentSeed;

            // UNIQUE KEY: e.g., colordle_save_xkcd_20557
            const currentList = localStorage.getItem('colordle_list') || 'colornames.csv';
            const saveKey = `colordle_save_${currentList}_${currentSeed}`;
            
            const savedData = localStorage.getItem(saveKey);
            if (savedData) {
                gameState = JSON.parse(savedData);
                guessCount = gameState.guesses.length; 
            } else {
                gameState = { seed: currentSeed, won: false, guesses: [], submitted: false, rank: null };
                guessCount = 0;
            }
            const goodColors = ALL_COLORS.filter(c => c.isGood);
            const pool = goodColors.length > 0 ? goodColors : ALL_COLORS;
            const targetIndex = Math.abs(currentSeed) % pool.length;
            targetColor = pool[targetIndex];
            targetLab = toLab(parse(targetColor.hex));

            // console.log(`Seed: ${currentSeed}. Target: ${targetColor.name}`);

            renderHistory();
            if (gameState.won) revealWin(false);
            
            // Sync Firebase stats at load
            syncStats();
        }

        function resetCurrentGame() {
            if(!confirm("Are you sure you want to reset progress for this color?")) return;
            
            gameState = { seed: currentSeed, won: false, guesses: [], submitted: false, rank: null };
            guessCount = 0;
            saveGame();

            document.getElementById('historyList').innerHTML = '';
            document.getElementById('targetDisplay').style.display = 'none';
            document.getElementById('settingsModal').style.display = 'none';
            document.getElementById('guessInput').value = '';
            document.getElementById('inputPreview').style.backgroundColor = 'transparent';
        }

        function getContrastYIQ(hexcolor){
            hexcolor = hexcolor.replace("#", "");
            if(hexcolor.length === 3) hexcolor = hexcolor.split('').map(c=>c+c).join('');
            var r = parseInt(hexcolor.substr(0,2),16);
            var g = parseInt(hexcolor.substr(2,2),16);
            var b = parseInt(hexcolor.substr(4,2),16);
            var yiq = ((r*299)+(g*587)+(b*114))/1000;
            return (yiq >= 128) ? '#000000' : '#ffffff';
        }

        function handleGuess() {
            if (gameState.won) return;

            const input = document.getElementById('guessInput');
            const val = input.value.trim();
            let guessHex = null;
            let guessDisplayName = val;

            if (val.startsWith('#')) {
                if (parse(val)) {
                    guessHex = val;
                    const known = ALL_COLORS.find(c => c.hex.toLowerCase() === val.toLowerCase());
                    if (known) guessDisplayName = known.name;
                }
            } else {
                const found = ALL_COLORS.find(c => c.name.toLowerCase() === val.toLowerCase());
                if (found) {
                    guessHex = found.hex;
                    guessDisplayName = found.name;
                }
            }

            if (!guessHex) return;

            if (!gameState.startTime) {
                    gameState.startTime = Date.now();
                }               
                
            const guessLab = toLab(parse(guessHex));
            let deltaE = calcDeltaE(targetLab, guessLab);
            if (isNaN(deltaE)) deltaE = 0;
            const percentage = Math.max(0, 100 - deltaE).toFixed(2);
            
            guessCount++;

            const newGuess = {
                number: guessCount,
                name: guessDisplayName,
                hex: guessHex,
                score: percentage
            };
            
            gameState.guesses.push(newGuess);
            
            if (deltaE < 0.1) {
                gameState.won = true;
                const duration = Math.floor((Date.now() - gameState.startTime) / 1000);
                submitWinToFirebase(duration); 
                revealWin(true);
            }
            else {
            logAttemptToFirebase(guessDisplayName);
        }

            saveGame();
            renderHistory();

            input.value = '';
            document.getElementById('inputPreview').style.backgroundColor = 'transparent';
            document.getElementById('suggestions').style.display = 'none';
        }

        function saveGame() {
            const currentList = localStorage.getItem('colordle_list') || 'colornames.csv';
            const saveKey = `colordle_save_${currentList}_${currentSeed}`;
            localStorage.setItem(saveKey, JSON.stringify(gameState));
        }

        function renderHistory() {
            const myTries = gameState.guesses.length;
            const threshold = globalAvgTries ? globalAvgTries * 0.5 : Infinity;
            const canShowHints = (globalWinners > 0 && myTries >= threshold) || myTries > 50;
            const container = document.getElementById('historyList');
            container.innerHTML = '';
            if (gameState.guesses.length === 0) return;

            let history = [...gameState.guesses];
            let displayList = (sortOrder === 'latest') ? history.reverse() : [history.pop(), ...history.sort((a, b) => b.score - a.score)];


    displayList.forEach(g => {
        const row = document.createElement('div');
        const textColor = getContrastYIQ(g.hex);
        row.className = 'guess-row';
        row.style.backgroundColor = g.hex;
        row.style.color = textColor;
        row.style.borderColor = textColor === '#ffffff' ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.1)';

        // --- CALCULATE HINTS ---
        const gLab = toLab(parse(g.hex));
        const deltaE = calcDeltaE(targetLab, gLab);
        let hints = [];
        
        const hintDeltaeThreshold = 1.0
        if (targetLab.l > gLab.l + hintDeltaeThreshold) hints.push('Lighter ↑');
        else if (targetLab.l < gLab.l - hintDeltaeThreshold) hints.push('Darker ↓');
        if (targetLab.a > gLab.a + hintDeltaeThreshold) hints.push('Redder +a');
        else if (targetLab.a < gLab.a - hintDeltaeThreshold) hints.push('Greener -a');
        if (targetLab.b > gLab.b + hintDeltaeThreshold) hints.push('Yellower +b');
        else if (targetLab.b < gLab.b - hintDeltaeThreshold) hints.push('Bluer -b');

        // Only say Target Reached if it is actually the winning threshold
        const hintString = (deltaE < 0.1) ? '✨ Target Reached!' : hints.join(' • ');
        const hintId = `hint-text-${g.number}`;

        // 2. ONLY SHOW BUTTON IF UNLOCKED OR IF USER WON THIS GUESS
        let hintButtonHTML = '';
        if (canShowHints || deltaE < 0.1) {
            hintButtonHTML = `
                <button onclick="document.getElementById('${hintId}').style.display='block'; this.style.display='none';" 
                        style="background:rgba(255,255,255,0.15); border:1px solid currentColor; color:inherit; border-radius:4px; width:24px; height:24px; cursor:pointer; margin-right:5px; font-size:12px; display:flex; align-items:center; justify-content:center;">
                    ?
                </button>`;
        }

        row.innerHTML = `
            <span class="guess-num">#${g.number}</span>
            <div class="guess-details" style="display:flex; flex-direction:column; width:100%;">
                <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
                    <span class="guess-name" style="flex-grow:1; text-align:left;">${g.name}</span>
                    <span class="guess-score" style="margin-right:10px;">${g.score}%</span>
                    
                    ${hintButtonHTML}

                    <a href="explore.html?goto=${encodeURIComponent(g.hex)}" 
                       style="background:rgba(255,255,255,0.2); border-radius:4px; padding:4px; display:flex; align-items:center; color:inherit; text-decoration:none;">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
                    </a>
                </div>
                <div id="${hintId}" style="display:none; font-size: 11px; opacity: 0.9; margin-top: 6px; font-weight: bold; text-align:left; letter-spacing: 0.5px;">
                    ${hintString}
                </div>
            </div>
        `;
        container.appendChild(row);
    });     
}

        function revealWin(animate = true) {
            const display = document.getElementById('targetDisplay');
            display.style.display = 'block';
            display.innerHTML = `
                <h2>🎉 YOU WON!</h2>
                <p>The color was <b>${targetColor.name}</b></p>
                <div style="margin:10px auto; width:100px; height:40px; background:${targetColor.hex}; border:2px solid #555; border-radius:4px;"></div>
            `;
            if(animate) window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        
        let globalAvgTries = null;
        let globalWinners = 0;
        // --- FIREBASE STATS FUNCTIONS ---
       function syncStats() {
        
            if (unsubscribeStats) {
                unsubscribeStats();
            }

            
            unsubscribeStats = onSnapshot(getStatsRef(), (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    globalWinners = data.winnerCount || 0;
                    globalAvgTries = globalWinners > 0 ? (data.totalTries / globalWinners) : null;

                    document.getElementById('statWinners').innerText = globalWinners;
                    document.getElementById('statAvg').innerText = globalAvgTries ? globalAvgTries.toFixed(1) : "0";
                                
                    if (gameState.rank) {
                        document.getElementById('statRank').innerText = `#${gameState.rank}`;
                    } else {
                        document.getElementById('statRank').innerText = `--`;
                    }
                    renderHistory(); 
                } else {
                    
                    document.getElementById('statWinners').innerText = "0";
                    document.getElementById('statAvg').innerText = "0";
                    document.getElementById('statRank').innerText = "--";
                }
            });
        }

        async function logAttemptToFirebase(colorName) {

            
        const statsRef = getStatsRef();
        try {
            const snap = await getDoc(statsRef);

            if (!snap.exists()) {
                await setDoc(statsRef, {
                    winnerCount: 0,
                    totalTries: 0,
                    totalSeconds: 0,
                    totalIncorrectGuesses: 1,
                    lastGuess: serverTimestamp(),
                    lastGuessName: colorName
                });
            } else {
                await updateDoc(statsRef, {
                    totalIncorrectGuesses: increment(1),
                    lastGuess: serverTimestamp(),
                    lastGuessName: colorName
                });
            }
        } catch(e) {
            console.error("Error logging attempt:", e);
        }
    }
        async function submitWinToFirebase(seconds) {
            if (gameState.submitted) return; 

            const statsRef = getStatsRef();
            const tries = gameState.guesses.length;

            try {
                const snap = await getDoc(statsRef);
                let myRank = 1;

                if (!snap.exists()) {
                    // First winner creates the record
                    await setDoc(statsRef, { 
                        winnerCount: 1, 
                        totalTries: tries, 
                        totalSeconds: seconds,
                        totalIncorrectGuesses: 0,
                        lastWin: serverTimestamp()
                    });
                } else {
                    // Future winners update counters and calculate rank
                    myRank = (snap.data().winnerCount || 0) + 1;
                    await updateDoc(statsRef, {
                        winnerCount: increment(1),
                        totalTries: increment(tries),
                        totalSeconds: increment(seconds),
                        lastWin: serverTimestamp()
                    });
                }

                gameState.submitted = true;
                gameState.rank = myRank; 
                document.getElementById('statRank').innerText = `#${myRank}`;
                saveGame();
            } catch (err) {
                console.error("Firebase submit error:", err);
            }
        }   
        // --- EVENTS ---
        const inputEl = document.getElementById('guessInput');
        const previewEl = document.getElementById('inputPreview');
        const suggestions = document.getElementById('suggestions');

        document.addEventListener('click', (e) => {
            const isClickInside = inputEl.contains(e.target) || suggestions.contains(e.target);
            if (!isClickInside) {
                suggestions.style.display = 'none';
            }
        });

        const settingsIcon = document.getElementById('settingsIcon');
        const settingsModal = document.getElementById('settingsModal');
        
        settingsIcon.addEventListener('click', (e) => {
            e.stopPropagation(); 
            const isVisible = settingsModal.style.display === 'block';
            settingsModal.style.display = isVisible ? 'none' : 'block';
        });

        document.getElementById('resetGameBtn').addEventListener('click', resetCurrentGame);

        maxInput.addEventListener('input', (e) => {
            maxSuggestions = parseInt(e.target.value);
            maxDisplay.innerText = maxSuggestions;
        });

        const sortInput = document.getElementById('sortOrderInput');
        sortInput.addEventListener('change', (e) => {
            sortOrder = e.target.value;
            renderHistory();
        });

        inputEl.addEventListener('input', (e) => {
            const val = e.target.value.trim().toLowerCase();
            suggestions.innerHTML = '';
            
            let validColor = parse(val);
            if(!validColor && val.length > 1) {
                const found = ALL_COLORS.find(c => c.name.toLowerCase() === val);
                if(found) validColor = found.hex;
            }
            previewEl.style.backgroundColor = validColor ? (typeof validColor === 'string' ? validColor : val) : 'transparent';

            if (val.length < 2 || val.startsWith('#')) { 
                suggestions.style.display = 'none'; 
                return; 
            }

            let matches = ALL_COLORS.filter(c => c.name.toLowerCase().includes(val));
            matches.sort((a, b) => {
                const aName = a.name.toLowerCase();
                const bName = b.name.toLowerCase();
                if (aName === val) return -1;
                if (bName === val) return 1;
                return aName.startsWith(val) ? -1 : 1;
            });

            matches = matches.slice(0, maxSuggestions);

            if (matches.length > 0) {
                suggestions.style.display = 'block';
                matches.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerHTML = `<div class="mini-swatch" style="background:${c.hex}"></div>${c.name}`;
                    div.onclick = () => {
                        inputEl.value = c.name;
                        previewEl.style.backgroundColor = c.hex;
                        suggestions.style.display = 'none';
                        inputEl.focus();
                    };
                    suggestions.appendChild(div);
                });
            } else {
                suggestions.style.display = 'none';
            }
        });

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const val = inputEl.value.trim().toLowerCase();
                const exactMatch = ALL_COLORS.find(c => c.name.toLowerCase() === val);
                const isHex = val.startsWith('#') && parse(val);

                if (exactMatch || isHex) {
                    handleGuess();
                    suggestions.style.display = 'none';
                } else if (suggestions.style.display === 'block' && suggestions.firstChild) {
                    suggestions.firstChild.click();
                }
            }
        });

        document.getElementById('guessBtn').addEventListener('click', handleGuess);
        
        document.getElementById('seedBtn').addEventListener('click', () => {
            const val = parseInt(document.getElementById('seedInput').value);
            if(!isNaN(val)) initGame(val);
        });

        // --- RANDOM & SHARE BUTTONS ---
        document.getElementById('randomBtn').addEventListener('click', () => {
            const randomSeed = Math.floor(Math.random() * 999999);
            window.location.href = `?seed=${randomSeed}`;
        });

        document.getElementById('shareBtn').addEventListener('click', () => {
            // Generate link with the current seed
            const currentList = localStorage.getItem('colordle_list') || 'colornames.csv';
            const shareUrl = `${window.location.origin}${window.location.pathname}?seed=${currentSeed}&list=${currentList}`;
            
            navigator.clipboard.writeText(shareUrl).then(() => {
                const btn = document.getElementById('shareBtn');
                const originalIcon = btn.innerHTML;
                
                // Switch to a green Checkmark icon
                btn.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
                
                // Change back after 2 seconds
                setTimeout(() => {
                    btn.innerHTML = originalIcon;
                }, 2000);
            });
        });

        // // Check the URL for a ?seed= parameter when the page loads
        // loadColors().then(() => {
        //     const urlParams = new URLSearchParams(window.location.search);
        //     const urlSeed = urlParams.get('seed');
            
        //     if (urlParams.has('seed') && !isNaN(parseInt(urlSeed))) {
        //         initGame(parseInt(urlSeed));
        //     } else {
        //         initGame(); // Load the daily challenge by default
        //     }
        // });


        // This function handles starting the game
        function startColordle() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlSeed = urlParams.get('seed');
            const urlList = urlParams.get('list');

            if (urlList) {
                localStorage.setItem('colordle_list', urlList);
                const selector = document.getElementById('dictionarySelect');
                if (selector) selector.value = urlList;
            }

            if (urlSeed !== null && !isNaN(parseInt(urlSeed))) {
                initGame(parseInt(urlSeed));
            } else {
                initGame(); 
            }
        }

        setupDictionarySelector('dictSelectorContainer', () => {
            // This runs on page load AND every time you change the list
            // It ensures the target color is picked from the NEW list immediately
            startColordle();
        });       


    
        // --- FEEDBACK LOGIC ---
        const feedbackIcon = document.getElementById('feedbackIcon');
        const feedbackModal = document.getElementById('feedbackModal');
        const submitFeedbackBtn = document.getElementById('submitFeedbackBtn');
        const closeFeedbackBtn = document.getElementById('closeFeedbackBtn');
        const feedbackText = document.getElementById('feedbackText');

        // Open Modal
        feedbackIcon.addEventListener('click', (e) => {
            e.stopPropagation();
            feedbackModal.style.display = 'block';
            feedbackText.focus();
        });

        // Close Modal
        closeFeedbackBtn.addEventListener('click', () => {
            feedbackModal.style.display = 'none';
        });

        // Submit to Firebase
        submitFeedbackBtn.addEventListener('click', async () => {
            const text = feedbackText.value.trim();
            if (!text) return;
            
            submitFeedbackBtn.innerText = "Sending...";
            submitFeedbackBtn.disabled = true;
            
            try {
                // We use Date.now() to generate a unique ID for each feedback message
                await setDoc(doc(db, "feedback", Date.now().toString()), {
                    message: text,
                    seed: currentSeed, // Good to know which color they are playing
                    timestamp: new Date().toISOString()
                });
                
                feedbackText.value = '';
                submitFeedbackBtn.innerText = "Sent! Thanks!";
                
                setTimeout(() => {
                    feedbackModal.style.display = 'none';
                    submitFeedbackBtn.innerText = "Send";
                    submitFeedbackBtn.disabled = false;
                }, 2000);
                
            } catch (e) {
                console.error("Feedback error", e);
                submitFeedbackBtn.innerText = "Error. Try again.";
                submitFeedbackBtn.disabled = false;
            }
        });


        document.getElementById('homeBtn').addEventListener('click', () => {
            // 1. Remove the ?seed= parameter from the URL
            // This makes the URL clean again: https://osmanyo.github.io/colordle/
            const cleanUrl = window.location.origin + window.location.pathname;
            window.history.replaceState({}, document.title, cleanUrl);

            initGame(null);
        });

        // Helper to get the correct Firebase document reference
        function getStatsRef() {
            const currentList = localStorage.getItem('colordle_list') || 'colornames.csv';
            return doc(db, "dailyStats", currentList + "_" + currentSeed.toString());
        }

    </script>
